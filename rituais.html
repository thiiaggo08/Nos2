<!DOCTYPE html>
<html lang="pt-BR" data-page="rituais">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nós 2">
<meta name="theme-color" content="#2a1d24">
<meta name="robots" content="noindex,nofollow">
<title>Nós 2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="js/core.js"></script>
<style>
:root{--bg:#171216;--card:#221a20;--line:#3a2d35;--ink:#f1e9e4;--mute:#b3a4a9;--acc:#d9a873;--rose:#b5526a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 30px}
.top{display:flex;justify-content:space-between;align-items:center}
.top a,.top button{color:var(--acc);background:none;border:0;font:600 15px -apple-system,system-ui,sans-serif;min-height:44px;padding:0;text-decoration:none;display:inline-flex;align-items:center}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0;line-height:1.15}
h1{font-size:32px;margin:6px 0 4px}h2{font-size:23px;margin:0 0 6px}
p{margin:6px 0 10px}.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.card .meta{color:var(--acc);font-size:13px;letter-spacing:1px;text-transform:uppercase}
button.btn,a.btn{display:flex;width:100%;min-height:48px;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 15px -apple-system,system-ui,sans-serif;margin-top:10px;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--rose);border-color:var(--rose);color:#fff}
.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.frase{font-family:Georgia,serif;font-size:24px;line-height:1.35;text-align:center;padding:18px 6px}
.passo{font-family:Georgia,serif;font-size:22px;line-height:1.4;padding:6px 2px 4px}
.timer{font-family:ui-monospace,Menlo,monospace;font-size:52px;text-align:center;color:var(--acc);margin:10px 0 0}
.prog{display:flex;gap:4px;margin:10px 0}.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.prog i.d{background:var(--acc)}.prog i.c{background:var(--rose)}
.fim{border-left:3px solid var(--acc);background:#2a2018;border-radius:10px;padding:12px;margin-top:12px;font-size:16px}
.obs{font-size:14px;color:var(--mute);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html" id="voltarTopo">‹ Nós 2</a><button id="lockBtn">Trancar</button></div>
  <div id="area"></div>
</div>
<script src="js/rituais-data.js"></script>
<script>
{
const {store,esc,lock}=Nos2;
const $=id=>document.getElementById(id);
const R=window.RITUAIS, porId=id=>R.find(r=>r.id===id);
const VALIDADE=12*3600*1000;
const qs=new URLSearchParams(location.search);
/* volta: só caminhos internos do app */
const voltaSegura=v=>(v&&/^[a-z]+\.html(#[a-z]+)?$/i.test(v))?v:"";
let S=null;      // sessão: {id,i,fase,left,acabou,volta,savedAt}
let tick=null, endAt=0;

const fmt=s=>{ s=Math.max(0,Math.ceil(s)); return s<60&&S&&porId(S.id).passos[S.i].s<60?`${s} s`:`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
function salvar(){ if(!S) return store.del("ritual.sessao"); S.savedAt=Date.now(); store.set("ritual.sessao",S); }
function restante(){ return endAt?Math.max(0,(endAt-Date.now())/1000):S.left; }
function parar(){ Nos2.tela.pausar(); if(tick){ clearInterval(tick); tick=null; } if(S&&endAt){ S.left=restante(); } endAt=0; }
function sino(){ try{ const AC=new (window.AudioContext||window.webkitAudioContext)(), o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=660; g.gain.setValueAtTime(.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(.15,AC.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1.4); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+1.5); }catch(e){} try{navigator.vibrate&&navigator.vibrate(300)}catch(e){} }
function correr(){
  parar(); endAt=Date.now()+S.left*1000; salvar(); Nos2.tela.continuar();
  tick=setInterval(()=>{ const l=restante(), e=$("tmr"); if(e) e.textContent=fmt(l);
    if(l<=0&&!S.acabou){ S.acabou=true; S.left=0; parar(); Nos2.tela.continuar(); salvar(); sino(); render(); } },250);
}
function sair(){ const v=S&&S.volta; parar(); S=null; salvar(); location.href=voltaSegura(v)||"rituais.html"; }

/* ---------- telas ---------- */
function lista(){
  parar(); S=null;
  $("area").innerHTML=`<h1>Rituais</h1><p class="mute">Momentos guiados do casal. Um passo por vez, com tempo.</p>`+
  R.map(r=>`<div class="card"><div class="meta">${esc(r.dur)}</div><h2>${esc(r.nome)}</h2><p class="mute" style="margin:0">${esc(r.quando)}</p><button class="btn" data-r="${r.id}">Abrir</button></div>`).join("")+
  `<button class="btn" id="gpv" style="margin-top:22px;border-style:dashed">Guarda pra volta${lembrancas().length?` · ${lembrancas().length}`:""}</button>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>abrir(b.dataset.r,voltaSegura(qs.get("volta"))));
  $("gpv").onclick=guardaTela;
}
/* ---------- anotações só deste iPhone (não entram nos códigos de troca nem no placar) ---------- */
const gestos=id=>store.get("gestos",[]).filter(g=>g.ritual===id);
const lembrancas=()=>store.get("guardaVolta",[]);
const dataCurta=iso=>new Date(iso).toLocaleDateString("pt-BR",{day:"numeric",month:"short"});
let escolhida=null, gestoOculto=false;
function guardaTela(){
  parar(); S=null; window.scrollTo(0,0);
  const L=lembrancas();
  $("area").innerHTML=`<h1>Guarda pra volta</h1>
  <div class="card"><label for="gvTxt" style="display:block;font-size:16px;margin-bottom:8px">O que você quer me contar quando a gente se encontrar?</label>
   <textarea id="gvTxt" style="width:100%;min-height:110px;font:16px -apple-system,system-ui,sans-serif;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></textarea>
   <button class="btn pri" id="gvOk">Guardar pra volta</button></div>
  ${L.length?`<h2 style="margin-top:22px">Guardadas neste iPhone</h2>`+L.slice().reverse().map(l=>`<div class="card"><div class="meta">${dataCurta(l.criado)}</div><p style="margin:6px 0 0;white-space:pre-wrap">${esc(l.texto)}</p><button class="btn" data-del="${l.id}">Apagar</button></div>`).join(""):""}
  <button class="btn" id="gvVolta">Voltar aos rituais</button>`;
  $("gvOk").onclick=()=>{ const t=$("gvTxt").value.trim(); if(!t) return; const a=lembrancas(); a.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),texto:t,criado:new Date().toISOString()}); store.set("guardaVolta",a); guardaTela(); };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ store.set("guardaVolta",lembrancas().filter(x=>x.id!==b.dataset.del)); guardaTela(); });
  $("gvVolta").onclick=lista;
}
function lembrancasTela(){
  window.scrollTo(0,0); const L=lembrancas();
  $("area").innerHTML=`<h1>O que guardei pra contar</h1>`+(L.length?L.slice().reverse().map(l=>`<div class="card"><div class="meta">${dataCurta(l.criado)}</div><p style="margin:6px 0 0;white-space:pre-wrap">${esc(l.texto)}</p><div class="row"><button class="btn pri" data-esc="${l.id}">Escolher</button><button class="btn" data-del="${l.id}">Apagar</button></div></div>`).join(""):`<p class="mute">Nada guardado neste iPhone.</p>`)+
  `<button class="btn" id="lvVolta">Voltar ao ritual</button>`;
  document.querySelectorAll("[data-esc]").forEach(b=>b.onclick=()=>{ escolhida=b.dataset.esc; render(); });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ store.set("guardaVolta",lembrancas().filter(x=>x.id!==b.dataset.del)); if(escolhida===b.dataset.del) escolhida=null; lembrancasTela(); });
  $("lvVolta").onclick=render;
}
function abrir(id,volta){ S={id,i:0,fase:"intro",left:porId(id).passos[0].s,acabou:false,volta:volta||""}; salvar(); render(); }
function render(){
  const r=porId(S.id); window.scrollTo(0,0);
  if(S.fase==="intro"){
    $("area").innerHTML=`<div class="meta mute" style="margin-top:8px">${esc(r.dur)} · ${r.passos.length} ${r.passos.length===1?"passo":"passos"}</div><h1>${esc(r.nome)}</h1><p class="mute">${esc(r.quando)}</p>
    ${r.abre?`<div class="card"><div class="frase">${esc(r.abre)}</div></div>`:""}
    ${r.obs?`<p class="obs">${esc(r.obs)}</p>`:""}
    ${(()=>{ const G=gestos(r.id); if(!G.length||gestoOculto) return ""; return `<div class="card"><div class="meta">Gesto que quero repetir</div>${G.map(g=>`<p style="margin:8px 0 0;white-space:pre-wrap">${esc(g.texto)}</p><div class="row"><button class="btn" data-manter="1">Manter para outra ocasião</button><button class="btn" data-gdel="${g.id}">Apagar</button></div>`).join("")}</div>`; })()}
    ${r.id==="reencontro"&&lembrancas().length?(()=>{ const l=lembrancas().find(x=>x.id===escolhida); return (l?`<div class="card"><div class="meta">Para contar</div><p style="margin:8px 0 0;white-space:pre-wrap">${esc(l.texto)}</p></div>`:"")+`<button class="btn" id="verLemb">Ver o que guardei pra contar</button>`; })():""}
    <button class="btn pri" id="go">Começar</button><button class="btn" id="enc">Voltar</button>`;
    document.querySelectorAll("[data-manter]").forEach(b=>b.onclick=()=>{ gestoOculto=true; render(); });
    document.querySelectorAll("[data-gdel]").forEach(b=>b.onclick=()=>{ store.set("gestos",store.get("gestos",[]).filter(g=>g.id!==b.dataset.gdel)); render(); });
    if($("verLemb")) $("verLemb").onclick=lembrancasTela;
    $("go").onclick=()=>{ Nos2.tela.iniciarSessao(); S.fase="passo"; S.i=0; S.left=r.passos[0].s; S.acabou=false; render(); correr(); };
    $("enc").onclick=sair; return;
  }
  if(S.fase==="fim"){
    $("area").innerHTML=`<h1>${esc(r.nome)}</h1>${r.fecha?`<div class="card"><div class="frase">${esc(r.fecha)}</div></div>`:""}<button class="btn pri" id="ok">${S.volta?"Voltar":"Voltar aos rituais"}</button>`;
    $("ok").onclick=sair; return;
  }
  if(S.fase==="pausa"){
    const p=r.passos[S.i];
    $("area").innerHTML=`<h1>${esc(r.nome)}</h1><div class="card"><div class="meta">Passo ${S.i+1} de ${r.passos.length} · pausado</div><div class="passo">${esc(p.t)}</div><div class="timer">${fmt(S.left)}</div></div>
    <div class="card"><h2>Querem continuar de onde pararam?</h2><button class="btn pri" id="ret">Retomar</button><button class="btn" id="enc">Encerrar por hoje</button></div>`;
    $("ret").onclick=()=>{ S.fase="passo"; render(); if(!S.acabou) correr(); }; // retomada em silêncio
    $("enc").onclick=sair; return;
  }
  const p=r.passos[S.i], ultimo=S.i===r.passos.length-1;
  $("area").innerHTML=`<div class="meta mute" style="margin-top:8px">${esc(r.nome)}</div>
  <div class="prog">${r.passos.map((_,k)=>`<i class="${k<S.i?"d":k===S.i?"c":""}"></i>`).join("")}</div>
  <div class="card"><div class="meta">Passo ${S.i+1} de ${r.passos.length}</div><div class="passo">${esc(p.t)}</div>
   <div class="timer" id="tmr" aria-live="polite">${fmt(S.left)}</div>
   ${S.acabou?`<div class="fim">O tempo deste passo acabou. Avancem quando quiserem.</div>`:""}${Nos2.tela.html()}</div>
  ${!S.acabou?`<button class="btn" id="pz">Pausar</button>`:""}
  <button class="btn pri" id="nx">${ultimo?"Concluir":"Próximo passo"}</button>
  <button class="btn" id="enc">Encerrar o ritual</button>`;
  if($("pz")) $("pz").onclick=()=>{ parar(); S.fase="pausa"; salvar(); render(); };
  $("nx").onclick=()=>{ parar(); if(ultimo){ S.fase="fim"; salvar(); render(); return; } S.i++; S.left=r.passos[S.i].s; S.acabou=false; render(); correr(); };
  $("enc").onclick=sair;
}

/* ---------- pausa ao sair da tela ---------- */
document.addEventListener("visibilitychange",()=>{
  if(!S||S.fase==="intro"||S.fase==="fim") return;
  if(document.hidden){ parar(); if(S.fase==="passo") S.fase="pausa"; salvar(); }
  else if(S.fase==="pausa") render();
});
window.addEventListener("pagehide",()=>{ if(S&&S.fase==="passo"){ parar(); S.fase="pausa"; salvar(); } });

$("lockBtn").onclick=()=>{ if(S&&S.fase==="passo"){ parar(); S.fase="pausa"; salvar(); } lock.lock(); };
if(voltaSegura(qs.get("volta"))) $("voltarTopo").href=voltaSegura(qs.get("volta"));

/* ---------- início: sessão salva (até 12 h) ---------- */
const salva=store.get("ritual.sessao",null), pedido=qs.get("r");
if(salva&&salva.savedAt&&Date.now()-salva.savedAt<VALIDADE&&porId(salva.id)&&(!pedido||pedido===salva.id)&&salva.fase!=="fim"){
  S=salva; if(S.fase==="passo") S.fase="pausa"; if(S.fase==="pausa"){ salvar(); } render();
} else {
  store.del("ritual.sessao");
  if(pedido&&porId(pedido)) abrir(pedido,voltaSegura(qs.get("volta"))); else lista();
}
window.RIT_TEST={get S(){return S}};
}
</script>
</body>
</html>
